services:
  db:
    image: postgres:16-alpine
    container_name: inventory_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: inventory_backend
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      ENVIRONMENT: PROD
      DEBUG: "False"
      DATABASE_URL: postgresql://inventory:inventory_dev@db:5432/inventory_db
      PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    container_name: inventory_frontend
    restart: unless-stopped
    working_dir: /app
    environment:
      VITE_API_URL: http://localhost:8000/api
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "corepack enable && pnpm install && pnpm run dev --host"

volumes:
  pgdata: