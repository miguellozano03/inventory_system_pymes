services:
  - type: web
    name: inventory-backend
    runtime: docker
    rootDir: backend
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: PROD
      - key: DEBUG
        value: "False"
      # Supabase/Neon: pega aquí tu cadena de conexión de POSTGRESQL.
      # Ej. postgresql://user:password@host:5432/dbname?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Render añade automáticamente RENDER_EXTERNAL_HOSTNAME a ALLOWED_HOSTS.
      - key: ALLOWED_HOSTS
        value: "*"
      # Origen de tu frontend desplegado en Vercel
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SECRET_KEY
        generateValue: true
      # Landing (SPA en Vercel)
      - key: LANDING_APP_URL
        sync: false
      - key: LANDING_LOGIN_URL
        sync: false
      - key: LANDING_REGISTER_URL
        sync: false
      - key: LANDING_DOCS_URL
        sync: false
      - key: PORT
        value: "8000"